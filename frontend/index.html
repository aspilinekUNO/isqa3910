<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="logo-placeholder" aria-label="Logo placeholder">
            <img src="/static/assets/logo.jpg" alt="Logo" class="logo-image" />
          </div>
          <div class="brand-text">Information Assistant</div>
        </div>
      </header>

      <div class="toolbar" aria-label="Search controls">
        <label class="control-group">
          <span class="topic-label">Topic</span>
          <details class="dropdown topic-dropdown" aria-label="Topic filter">
            <summary id="topic-selected">Students</summary>
            <div class="dropdown-menu" role="menu">
              <button type="button" class="menu-item active" data-topic="Students">Students</button>
              <button type="button" class="menu-item" data-topic="Academics">Academics</button>
              <button type="button" class="menu-item" data-topic="Activities &amp; Athletics">Activities &amp; Athletics</button>
              <button type="button" class="menu-item" data-topic="Attendance">Attendance</button>
              <button type="button" class="menu-item" data-topic="Enrollment">Enrollment</button>
              <button type="button" class="menu-item" data-topic="Health &amp; Wellness">Health &amp; Wellness</button>
              <button type="button" class="menu-item" data-topic="Families">Families</button>
              <button type="button" class="menu-item" data-topic="Staff">Staff</button>
              <button type="button" class="menu-item" data-topic="Departments">Departments</button>
              <button type="button" class="menu-item" data-topic="Policies &amp; Forms">Policies &amp; Forms</button>
              <button type="button" class="menu-item" data-topic="District Information">District Information</button>
            </div>
          </details>
        </label>

        <details class="dropdown school-dropdown" aria-label="School filter">
          <summary id="school-selected">Loading schools...</summary>
          <div class="dropdown-menu" role="menu" id="school-menu"></div>
        </details>

        <button type="button" class="secondary-action" id="visit-school-site">Visit school site</button>
        <button type="button" class="secondary-action" id="reset-filters">Reset filters</button>
      </div>

      <main class="workspace">
        <aside class="sidebar">
          <div class="sidebar-header">Ask about</div>
          <div class="sidebar-copy">Your selected topic and school will guide the answer.</div>
        </aside>

        <section class="chat-panel" aria-label="Assistant chat">
          <div id="chat-window" class="chat-window" aria-live="polite"></div>

          <form class="composer" id="question-form">
            <input type="text" placeholder="Ask a question..." aria-label="Ask a question" />
            <button type="submit" aria-label="Send question">➤</button>
          </form>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
